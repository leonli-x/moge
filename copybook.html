<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="可自定义汉字、按年级快速选字并生成 A4 描红字帖。" />
    <title>墨格 - 汉字描红生成器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23a63225'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='white'%3E墨%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <style id="print-page-style">@page { size: A4 portrait; margin: 0; }</style>
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到字帖设置</a>
    <svg aria-hidden="true" class="icon-sprite">
      <symbol id="icon-print" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></symbol>
      <symbol id="icon-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    </svg>

    <header class="app-header">
      <a class="brand" href="index.html" aria-label="墨格首页">
        <span class="brand-seal" aria-hidden="true">墨</span>
        <div>
          <h1>墨格</h1>
          <p>把每一个字，写进方正里</p>
        </div>
      </a>
      <div class="header-meta">
        <nav class="site-nav" aria-label="主导航">
          <a class="nav-link" href="index.html">首页</a>
          <a class="nav-link" href="zitie.html">笔顺学习</a>
          <a class="nav-link active" href="copybook.html" aria-current="page">字帖生成器</a>
          <a class="nav-link" href="math.html">口算题卡</a>
        </nav>
        <span class="save-status"><svg><use href="#icon-check"/></svg> 已自动保存</span>
        <button class="button primary header-print" type="button" data-print>
          <svg><use href="#icon-print"/></svg>
          生成 PDF / 打印
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="editor" id="editor" aria-label="字帖设置">
        <div class="editor-heading">
          <div>
            <span class="eyebrow">字帖设置</span>
            <h2>今天练什么字？</h2>
          </div>
          <span class="step-count">3 步完成</span>
        </div>

        <section class="setting-section" aria-labelledby="content-title">
          <div class="section-title-row">
            <span class="step-index">1</span>
            <div>
              <h3 id="content-title">选择内容</h3>
              <p>按年级一键填入，也可以继续增删</p>
            </div>
          </div>

          <label class="field-label">统编版语文写字表</label>
          <div class="grade-tabs" id="grade-tabs" role="group" aria-label="按年级选择教材写字表"></div>
          <div class="segmented semester-options" id="semester-options" role="group" aria-label="选择教材册次">
            <label><input type="radio" name="semester" value="upper" checked><span>上册</span></label>
            <label><input type="radio" name="semester" value="lower"><span>下册</span></label>
          </div>

          <div class="preset-card" id="preset-card">
            <div class="preset-icon" aria-hidden="true">一</div>
            <div class="preset-copy">
              <strong id="preset-name">一年级上册写字表</strong>
              <span id="preset-summary">按图片教材顺序</span>
            </div>
            <svg aria-hidden="true"><use href="#icon-chevron"/></svg>
          </div>

          <div class="field-row">
            <label class="field-label" for="characters">练习汉字</label>
            <span class="char-count" id="char-count">0 / 300</span>
          </div>
          <textarea id="characters" maxlength="600" rows="4" spellcheck="false" aria-describedby="characters-help"></textarea>
          <p class="field-help" id="characters-help">支持粘贴课文；标点和重复汉字会自动去除。</p>
          <p class="field-error" id="characters-error" role="alert"></p>
        </section>

        <section class="setting-section" aria-labelledby="style-title">
          <div class="section-title-row">
            <span class="step-index">2</span>
            <div>
              <h3 id="style-title">练习样式</h3>
              <p>选择格子和描红数量</p>
            </div>
          </div>

          <fieldset>
            <legend class="field-label">书写格</legend>
            <div class="grid-options" id="grid-options">
              <label class="grid-option"><input type="radio" name="grid" value="tian" checked><span class="grid-demo tian"><i>永</i></span><b>田字格</b></label>
              <label class="grid-option"><input type="radio" name="grid" value="mi"><span class="grid-demo mi"><i>永</i></span><b>米字格</b></label>
              <label class="grid-option"><input type="radio" name="grid" value="hui"><span class="grid-demo hui"><i>永</i></span><b>回宫格</b></label>
            </div>
            <p class="field-help">A4 横向按教学常用约 20mm 方格排版；中心线为虚线。</p>
          </fieldset>

          <div class="range-field">
            <div class="field-row">
              <label class="field-label" for="trace-count">每字描红</label>
              <output id="trace-output" for="trace-count">3 格</output>
            </div>
            <input id="trace-count" type="range" min="1" max="5" value="3" />
            <div class="range-labels"><span>少</span><span>多</span></div>
          </div>

          <div class="toggle-row">
            <div><label for="show-pinyin">显示拼音与偏旁</label><span>自动生成声调、部首和结构</span></div>
            <label class="switch"><input id="show-pinyin" type="checkbox" checked><span></span></label>
          </div>
        </section>

        <section class="setting-section" aria-labelledby="paper-title">
          <div class="section-title-row">
            <span class="step-index">3</span>
            <div>
              <h3 id="paper-title">纸张方向</h3>
              <p>选择 A4 打印方向</p>
            </div>
          </div>
          <fieldset>
            <legend class="field-label">A4 方向</legend>
            <div class="segmented" id="orientation-options">
              <label><input type="radio" name="orientation" value="landscape"><span>横向</span></label>
              <label><input type="radio" name="orientation" value="portrait" checked><span>纵向</span></label>
            </div>
          </fieldset>
        </section>

        <button class="button primary print-button" type="button" data-print>
          <svg><use href="#icon-print"/></svg>
          生成 PDF / 打印
        </button>
        <p class="print-hint">在打印窗口选择“另存为 PDF”，请开启“背景图形”。</p>
      </aside>

      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="preview-toolbar">
          <div>
            <span class="eyebrow">实时预览</span>
            <h2 id="preview-title">A4 打印效果</h2>
          </div>
          <div class="preview-info">
            <span id="page-count">1 页</span>
            <button class="icon-button" id="reset-button" type="button" title="恢复默认设置" aria-label="恢复默认设置">
              <svg><use href="#icon-rotate"/></svg>
            </button>
          </div>
        </div>
        <div class="pages" id="pages" aria-live="polite"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
